services:
  backend:
    # Django API
    image: scm:backend
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    # Vite + React Frontend
    image: scm:frontend
    build: ./frontend
    #command: npm run dev
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    # PostgreSQL Database
    image: scm:db
    build: ./db
    env_file:
      - .env
    ports:
      - "5432:5432"
